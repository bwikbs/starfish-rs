<!DOCTYPE html><html><head><style>
body{margin:0;background:#f0f0f0}
.stage{position:relative;height:360px}
.box{position:absolute;width:80px;height:50px;color:#fff}
#a{top:20px;left:20px;background:#e74c3c;transform:translate(40px,10px)}
#b{top:110px;left:40px;background:#2ecc71;transform:scale(1.5)}
#c{top:110px;left:240px;background:#3498db;transform:rotate(30deg)}
#d{top:240px;left:80px;background:#9b59b6;transform:rotate(45deg);transform-origin:0 0}
#e{top:250px;left:240px;background:#f39c12;transform:translate(20px) skewX(25deg)}
</style></head><body>
<div class="stage">
<div id="a" class="box">translate</div>
<div id="b" class="box">scale</div>
<div id="c" class="box">rotate</div>
<div id="d" class="box">origin 0 0</div>
<div id="e" class="box">skew</div>
</div>
</body></html>
