<html>
<head>
<style>
  body { margin: 8px; color: #000000; font-size: 24px; }
  p { margin: 0 0 6px 0; }
  .sans  { font-family: sans-serif; }
  .serif { font-family: serif; }
  .mono  { font-family: monospace; }
  .bold  { font-family: sans-serif; font-weight: 700; }
  .ital  { font-family: "Liberation Serif"; font-style: italic; }
</style>
</head>
<body>
  <p class="sans">Sans: The quick brown fox</p>
  <p class="serif">Serif: The quick brown fox</p>
  <p class="mono">Mono: The quick brown fox</p>
  <p class="bold">Bold: The quick brown fox</p>
  <p class="ital">Italic: The quick brown fox</p>
</body>
</html>
