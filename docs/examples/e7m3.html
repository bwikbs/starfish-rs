<!DOCTYPE html><html><head><style>

table{border-collapse:separate;border-spacing:4px;background:#f4f4f8}

th{background:#dde}

</style></head><body>
<h2>E7-M3 table</h2>
<table>
<thead><tr><th>Name</th><th>Qty</th><th>Price</th></tr></thead>

<tr><td>Ripe bananas</td><td>12</td><td>$3.10</td></tr>

</tbody>
</table>
</body></html>
