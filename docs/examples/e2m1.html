<html>
<head>
<style>
  body { margin: 16px; font-family: sans-serif; font-size: 16px }
  h2 { font-size: 20px }
  .under { text-decoration: underline; color: #0033cc }
  ol { list-style-type: decimal }
  .box {
    display: inline-block;
    width: 120px;
    height: 60px;
    margin-right: 12px;
    background: #4caf50;
    border: 2px solid #1b5e20;
  }
  .box2 { background: #2196f3; border-color: #0d47a1 }
</style>
</head>
<body>
  <h2>E2-M1 demo</h2>
  <p>This word is <span class="under">underlined</span> in the sentence.</p>

  <p>Unordered list:</p>
  <ul>
    <li>Apple</li>
    <li>Banana</li>
    <li>Cherry</li>
  </ul>

  <p>Ordered list:</p>
  <ol>
    <li>First</li>
    <li>Second</li>
    <li>Third</li>
  </ol>

  <p>Two inline-blocks side by side:</p>
  <div>
    <span class="box">left</span><span class="box box2">right</span>
  </div>
</body>
</html>
