<html>
<head>
<style>
  body { margin: 8px; font-size: 18px; font-family: sans-serif; }
  .rtl { direction: rtl; color: #003366; }
  .spaced { letter-spacing: 4px; text-transform: uppercase; color: #660033; }
  pre.code { white-space: pre; font-family: monospace; color: #114411;
             background: #eef; }
  .mixed { color: #333; }
</style>
</head>
<body>
  <p class="rtl">&#x05D0;&#x05D1;&#x05D2; &#x05D3;&#x05D4;&#x05D5; &#x05D6;&#x05D7;&#x05D8;</p>
  <p class="spaced">spaced uppercase line</p>
  <p class="mixed">latin &#x05E9;&#x05DC;&#x05D5;&#x05DD; 2026 mixed</p>
  <pre class="code">line one
    indented two
line three</pre>
</body>
</html>
