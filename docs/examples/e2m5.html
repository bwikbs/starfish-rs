<html>
<head>
<style>
  body { margin: 0; background: #f0f0f0; font-family: sans-serif; }
  .hero {
    width: 600px;
    height: 200px;
    background: linear-gradient(135deg, #ff5f6d, #2c3e50);
    color: #ffffff;
  }
  .card {
    width: 240px;
    height: 120px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 6px 8px 18px 2px rgba(0,0,0,0.4);
    margin: 30px;
    border: 2px solid #3498db;
  }
  .card2 {
    width: 240px;
    height: 120px;
    background: linear-gradient(to right, #56ab2f, #a8e063);
    border-radius: 30px;
    box-shadow: 0px 6px 20px 0 rgba(0,0,0,0.3);
    margin: 30px;
  }
  .overlay {
    width: 300px;
    height: 150px;
    background: #000000;
    opacity: 0.5;
    margin: 20px;
  }
</style>
</head>
<body>
  <div class="hero">Gradient hero</div>
  <div class="card">Rounded card with shadow</div>
  <div class="card2">Gradient rounded card</div>
  <div class="overlay">Semi-transparent overlay</div>
</body>
</html>
