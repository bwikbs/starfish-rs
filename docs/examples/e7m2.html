<!DOCTYPE html><html><head><style>
  body { font-family: sans-serif; margin: 16px; }
  ul { list-style: none; padding-left: 0; }
  li::before { content: "• "; color: #e11; font-weight: bold; }
  a::after { content: " ↗"; color: #08c; }
  [data-tag]::before { content: attr(data-tag); background: #eee; color: #060; font-weight: bold; }
</style></head><body>
  <h1>E7-M2 generated content</h1>
  <ul><li>One</li><li>Two</li><li>Three</li></ul>
  <p><a href="https://example.com">External link</a></p>
  <p><span data-tag="NEW ">item with chip</span></p>
</body></html>
